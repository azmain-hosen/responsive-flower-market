<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flower Market</title>
    <!-- CSS -->
    <link rel="stylesheet" href="styles/style.css">
    <!-- Font Styles -->
    <!-- Noto Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/dae13ebe8e.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <nav class="navbar px-2 w-full lg:w-[1140px] mx-auto flex items-center justify-between pt-7">
            <img src="images/logo.png" alt="Flower Market Logo" class="logo">
            <div class="nav-links gap-10 flex items-center justify-center">
                <a href="#" class="nav-link hidden md:inline-block text-[#252432]">Home</a>
                <a href="#" class="nav-link hidden md:inline-block text-[#8987A1]">Shop</a>
                <a href="#" class="nav-link hidden md:inline-block text-[#8987A1]">About Us</a>
                <a href="#" class="nav-link text-[#252432]"><i class="fa-solid fa-bag-shopping"></i>Cart ($65)</a>
            </div>
        </nav>

        <div class="hero-section w-full lg:w-[1140px] mx-auto flex items-center justify-between gap-10 px-2 mt-20 flex-col-reverse lg:flex-row">
            <div class="hero-image w-full lg:w-[50%]">
                <h1 class="text-[1.5rem] lg:text-[3.5rem] font-bold noto-serif-font-style">ALWAYS <span class="text-[#E95A08]">FRESH<br> FLOWERS</span></h1>
                <p class="text-[1rem] lg:text-[1.2rem] text-[#0000006b] inter-font-style">
                    Indulge your senses with the beauty and fragrance of our fresh flower shop. From classic roses to exotic blooms, we offer a wide variety of fresh flowers that are perfect for any occasion.  
                </p>
            </div>
            <div class="hero-image w-full lg:w-[50%]">
                <img src="images/hero-flower.png" alt="">
            </div>
        </div>
    </header>

    <main>

    </main>

    <footer>

    </footer>
</body>

</html>
